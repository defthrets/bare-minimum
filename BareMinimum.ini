; ===========================================================================
;  Bare Minimum  -  hunger and sleep for GTA V
; ===========================================================================
;
;  This file is NEVER overwritten by an update. That is deliberate -- it is the
;  file you hand-edit. When a new version adds a setting, the deploy prints
;  which ones are missing and the defaults apply until you add them.
;
;  The F11 menu DOES write to this file, but only the single lines whose values
;  you changed, and only once you stop pressing. Your comments, your ordering
;  and anything else you have edited here are left exactly as they are.
;
;  Every value here is the default. Deleting a line is the same as leaving it.
;
;  Times are in GAME hours, not real ones. At GTA's default rate a game hour is
;  about two real minutes, so a full game day is roughly 48 minutes of play.

[General]
Enabled = true
AnnounceOnLoad = true

; WHICH LANGUAGE THE MOD SPEAKS.
;
;   en-GB  English (UK)      es  Espanol        ru  Russian
;   en-US  English (US)      fr  French         pl  Polish
;   pt-BR  Portugues (BR)    de  German         zh  Chinese
;                                               hi  Hindi
;
; Also on the FIRST ROW of the first page of the F11 menu, where somebody who
; cannot read this file can still find it.
;
; ANYTHING A TRANSLATION HAS NOT COVERED SHOWS IN ENGLISH. That is the design and
; not a failure: the English is what the mod is written in, and a language file
; only says what to show INSTEAD -- so a half-finished translation is a working mod
; in two languages rather than a broken one with blanks in it. English (UK) reads
; no file at all, and en-US is a short diff over it, because the mod is written
; British.
;
; The files are lang\*.json beside this one and they are plain text. Copy
; lang\en-GB.json, fill in the right-hand side and save it under your own code --
; no rebuild and no tools. Food names and the lines under them translate exactly
; the same way the buttons do.
;
; WHETHER THE LETTERS DRAW IS A SEPARATE QUESTION FROM WHETHER THE WORDS EXIST.
; Text goes through GTA's own fonts and those hold what Rockstar shipped: Latin and
; Cyrillic always, so Spanish, French, German, Portuguese, Polish and Russian are
; safe. Han comes with the font the game loads for ITS OWN language, so Chinese
; here on an English game is likely to be empty boxes. Devanagari is not in the
; game at all -- GTA V has never had a Hindi release -- so Hindi will almost
; certainly be boxes. The log says which at load rather than leaving you guessing.
Language = en-GB

; Writes every phrase the mod has actually drawn to lang-seen.json next to the log,
; for whoever is translating. It is the only honest way to get that list: grepping
; the source turns up log lines and ini keys mixed in with the words, and misses
; every sentence that came out of foods.json.
;
; Play with it on, open every screen, then fill the file in.
LanguageDump = false
; Show drugs carried in Posted Up (Hoodrich) in this mod's pocket, and let you take one
; from there. Does nothing at all if that mod is not installed. They never take up a food
; slot -- that mod has a carrying limit of its own for them.
DrugsInPocket = true
; Error, Warn, Info or Debug. Debug is loud; it names every clipset request.
LogLevel = Info


[Hunger]
Enabled = true

; Game hours from a full stomach to an empty one, standing still.
; 52 is a bit over two game days -- about an hour and three quarters of real play.
; Slowed from 28: under an hour from full to starving made eating an errand rather
; than something you do while getting on with the game.
HoursToEmpty = 54

; How much faster you burn through it while sprinting, swimming or climbing.
; Running gets a bit under half of this. Driving counts as standing still.
ExertionMultiplier = 2.2

; How much you burn through while asleep. Low, but not nothing -- a night's
; sleep should cost you a meal.
SleepMultiplier = 0.45


[Sleep]
Enabled = true

; Game hours awake before the meter is empty. 80 is a bit over three game days,
; so the first slowdown lands after two of them. Slowed from 44.
HoursToEmpty = 82

; Hours of SLEEP that take you from empty to fully rested. Separate from, and
; much smaller than, HoursToEmpty -- recovery is not decline in reverse. You wear
; down over 44 waking hours; you do not need 44 in bed to undo it. 12 makes a
; six-hour night worth half a meter, so two nights take you from nothing to full.
HoursToFull = 8

; How much faster sleep goes while he is WORKING, at a full sprint. Deliberately
; smaller than the food one: running the length of the city makes you hungry long
; before it makes you sleepy. Stacks with the drink multiplier, so a drunk sprint
; is worse than either on its own. 1 turns it off.
ExertionMultiplier = 1.5

; RUNNING OUT ENTIRELY. The meter used to have no bottom -- it emptied, the walk
; went loose, and then nothing else ever happened however long you stayed up.
; Now the picture starts to swim, you get told, and half a minute later you are
; on the floor wherever you happen to be standing.
;
; It refuses in the places where it would be a death rather than a nuisance: in
; the air, in the water, and while the police are already after you. In a car it
; is allowed -- you slump at the wheel, and something may well come and look.
Collapse = true

; How long you are out for, in game hours.
CollapseHours = 4

; And how much of a rest that is, against a proper night. The car's figure, not
; the bed's: this is sleeping rough. Four hours at 0.55 comes back about a fifth
; of the meter, which is enough that you do not simply drop again.
CollapseQuality = 0.55

; REAL seconds between the meter hitting zero and you going down.
CollapseAfterSeconds = 30

; Whether an empty sleep meter makes the picture swim. The game's own "Wobbly".
Wobble = true


; ============================================================================
[Thirst]
; ============================================================================
;
; The third need. It behaves exactly as the other two do -- 100 is fine, 0 is
; trouble, and the bar beside them is the same instrument -- and what makes it
; its own thing is the speed. You go dry in a game day and one can fixes it,
; where a day's food is several meals.
Enabled = true

; Game hours from a full glass to a dry mouth. Well under half of hunger's 54,
; on purpose: a bar that emptied on hunger's clock would just be a second hunger
; bar you fix at the same counter. 24 is exactly a game day, so it empties about
; as often as you sleep and well over twice as often as you get hungry -- which
; is what earns the corner-shop fridge and every vending machine their place.
; It was 18, which was a third of hunger and a third too keen.
HoursToEmpty = 24

; Multiplier on the drain while ASLEEP. Higher than hunger's 0.45, because you
; wake up thirsty and you do not wake up starving. 0 stops it entirely.
SleepMultiplier = 0.6

; ---- what being dry actually does ------------------------------------------

; Below this being dry starts costing you your WIND -- see WindMultiplier, which
; ramps from here down. It does NOT slow your walking any more; that is what the
; name is left over from, and the note there says why it went.
;
; Lower than hunger's 0.34 on purpose: this meter empties in a game day where
; hunger takes two and a bit, so at the same figure thirst would be the one doing
; everything nearly all the time.
SlowAt = 0.28

; HOW A DRY MAN MOVES. The game's own tired set.
;
; THIS REPLACED A SPEED PENALTY. Being dry used to multiply your move rate the
; way hunger and sleep do -- and with three needs each taking a share, a man who
; was hungry, tired and dry walked at a THIRD speed. That does not read as
; somebody in a bad way, it reads as the game running in slow motion with nothing
; on screen saying why. Thirst no longer touches your speed at all.
;
; A clipset says it where you can see it: he moves at his own pace and plainly
; has nothing left.
;
; A LIST, TRIED IN ORDER, FIRST ONE THIS BUILD HAS WINS. That is not tidiness --
; move_m@tired is in every animation list on this machine and is NOT a movement
; clipset. It is a DICTIONARY, and the two look identical from outside the game.
; The mod asked for it, the game said no forever, and the walk silently never
; changed. There is no way to check a clipset name without running it, so the
; setting is several guesses and the game settles which it has. The log says
; which one won.
;
; There is ONE clipset slot on a ped, so these queue: drink, being winded, a
; comedown, an EMPTY thirst, hunger's injured walk, a low thirst, then sleep's.
; Blank turns it off.
Clipset = move_m@tired,move_m@buzzed,move_m@drunk@slightlydrunk,move_m@injured

; HOW MUCH FASTER THE SPRINT METER GOES WHEN YOU ARE DRY, at nothing left. 1
; turns it off.
;
; THIS IS THE ONE YOU FEEL. Slowing the walk is a number; losing your legs
; halfway across a forecourt is something that happens to you. It ramps from
; SlowAt down rather than switching on, and it lands on the ENERGY bar, which is
; already in the row -- so the cause and the effect are two bars side by side.
; The special ability is not touched: rationing that by how recently you had a
; can is a joke rather than a mechanic.
WindMultiplier = 2.4

; Below this he is audibly struggling: breathing hard, and now and then saying
; something about it. Lower than SlowAt, so the legs go before the lungs do --
; hearing him pant at the same moment the walk slows is being told one thing
; twice.
DryAt = 0.16

; REAL seconds between one breath and the next at the very bottom of the meter.
; It stretches to five times this at DryAt and halves again while running, so
; the RATE is the reading and you never have to look at the bar. Silent in a car.
;
; The breathing is the game's own non-verbal set -- inhale, exhale, wheeze,
; exhaustion -- in his own voice, so it is actually Franklin panting and there is
; no audio shipped with this mod.
BreathSeconds = 9

; Percent chance a breath is a spoken LINE instead. 0 for never.
;
; Low, and it has to be: there is no "I'm thirsty" line in GTA V. Every voice in
; the game was searched and the only thirst-shaped name anywhere is
; DEATH_UNDERWATER, which is the other problem entirely. So the line is the one
; DRINKING line among the out-of-breath ones, which reads as wanting one when you
; have not had one in a day -- and a stock line repeating is the fastest way to
; make a mod tiresome.
LineChance = 18

; What fills it: anything wet, most food a little, and spirits LESS THAN
; NOTHING. Every item in foods.json gets a figure worked out from what it is --
; a drink is 0.62, food carries across a fifth of its own hunger value, and
; alcohol subtracts -- unless that item names a "thirst" of its own, which wins.
; A shelf of beer is not a way to keep this bar full.


[Effects]
; TWO BARS AND THE LIGHTS START GOING OUT. One xanax is a heavy head and the
; walk to match; the second is where it stops being a state and becomes a thing
; that HAPPENS to you -- the screen going for a second with no warning, and
; coming back with you still walking, or still driving.
;
; It never takes your controls. Where you have got to by the time it comes back
; is the mechanic.
;
; The load wears off at a dose every nine real minutes, so it is something you
; are in and then are not. Off if you would rather a mod did not decide when you
; stop being able to see.
Blackouts = true

; HOW HARD A PSYCHEDELIC BENDS THE PICTURE, 0 to 1. LSD runs the game's own
; peyote timecycle for twelve real minutes, swelling and falling on two periods
; that do not divide into each other so it never settles into a filter you stop
; seeing.
;
; 0 is a legitimate answer: the drug still runs its twelve minutes and still
; costs the stomach, it just stops being something you have to look at.
TripStrength = 0.8

; The SHORTEST gap between them, in real seconds. The real wait is this to about
; two and a half times it, picked fresh every time -- a lapse you can feel coming
; is a mechanic you play around.
BlackoutEverySeconds = 22

; --- hunger ---
; Below this you start to slow down.
HungerSlowAt = 0.34
; Below this you walk like your stomach hurts.
HungerHurtAt = 0.15
; The slowest hunger alone will make you walk, against normal speed.
HungerMinMoveRate = 0.72
; The game's own hunched, side-clutching limp. Any movement clipset name works;
; a name that does not exist is reported once in the log and then ignored.
HungerClipset = move_m@injured

; --- sleep ---
; Below this, missed sleep starts to show.
SleepTiredAt = 0.35
; Below this you are properly out of it: unsteady walk, swaying camera, blur.
SleepDrunkAt = 0.18
SleepMinMoveRate = 0.85
; MODERATE drunk, not verydrunk. verydrunk is a stagger that makes doorways
; impossible; this is loose and unsteady but still gets you where you are going.
SleepClipset = move_m@drunk@moderatedrunk
; How hard the camera sways when exhausted. 0 turns it off entirely.
SleepCameraShake = 0.14

; --- well fed and rested ---
; A small speed bonus on foot when BOTH needs are up. 1.0 turns it off.
;
; Keep it small. The move-rate override scales the ANIMATIONS as well as the
; speed, so a big number does not read as "well fed", it reads as the game
; running fast -- the legs cycle quicker than the ground moves.
;
; The WORSE of the two needs decides it, so eating well and never sleeping does
; not collect it. Ramps in from WellFedAbove to completely full.
WellFedBonus = 1.05
WellFedAbove = 0.85

; --- starving ---
; Whether an empty stomach slowly costs health. It will never kill you: the
; floor is a third of your maximum, and it stops there.
StarvingCostsHealth = true
StarvingHealthPerHour = 15


[Drink]
Enabled = true

; Game hours to sober up from completely hammered. Eight, so a heavy night is
; still with you in the morning -- unless you sleep it off, which works for free,
; because sleeping advances the clock and this wears off on the clock.
HoursToSober = 8

; Above DrunkAt you start to show it; above HeavyAt it stops being merry and
; becomes a stagger. Two clipsets so it escalates.
DrunkAt = 0.22
HeavyAt = 0.65
Clipset = move_m@drunk@moderatedrunk
ClipsetHeavy = move_m@drunk@verydrunk

CameraShake = 0.28

; HOW MUCH FASTER TIREDNESS COMES ON WHEN DRUNK. This is the point of the whole
; mechanic: drink does not merely LOOK like being tired, it makes you tired, and
; fast. Scaled by how drunk you are, so one beer barely registers and a session
; of them costs most of a day's rest.
SleepMultiplier = 2.4


[Sleeping]
; Beds at the safehouses.
InBeds = true
; Sleeping in a stopped car. Shorter, and worth less than a real bed.
InCars = true
; Sleeping in a stopped car WITHOUT switching the engine off. Off: the car has
; to be stopped and switched off, which is the difference between parking up
; and pausing at the lights. On is for anybody who would rather not turn the key.
EngineOn = false
; How long E (or the pad's D-pad right) must be HELD to sleep in a CAR.
; Seconds. 0 goes back to a single tap.
;
; A car only, never a bed. In a car that button is also the one that orders at a
; drive-through, so a tap meant for lunch put you to sleep instead. At a bed
; nothing competes for the press and a hold there would buy nothing.
CarHoldSeconds = 1.5

BedHours = 8
CarHours = 4

; Sleep in a car IN THE ROAD and you may wake to a squad car nose-to-nose and two
; officers at the windows. A car park, a driveway or the back of a building never
; qualifies -- see Knock.Exposed. Drive off and it is one star; get out and one of
; them has something to say.
PoliceWake = true

; The FLOOR, not the answer. A back street sits near this; the odds climb with
; the width of the road and the traffic on it, to about 0.97 on a boulevard.
PoliceWakeChance = 0.6

; People and cars within seventy metres before the street counts as public.
PoliceWakeNeighbours = 6
; How much of a night a car is worth. A car is a WORSE sleep, not just a
; shorter one -- without this it would simply be a bed you carry around.
CarRestoreFraction = 0.55

; How close to a bed you have to stand before it offers, in metres.
BedReach = 1.6

; COUNT SLEEP THIS MOD DID NOT STAGE.
;
; Posted Up and Hoodrich both put Franklin to bed at his place, and neither shares
; an API with this mod. What this mod CAN see is the clock: a jump of a few hours
; it did not cause is, near enough always, somebody sleeping -- another mod's bed,
; or a mission that skips a night. Reading the clock rather than the mod makes it
; work for all of them at once, including ones not written yet.
;
; Bounded at BOTH ends on purpose. Under the floor it is a cutscene nudging the
; time along; over the ceiling it is a fast travel or a trainer, and crediting
; those would make the sleep half of this mod free to anyone with a time slider.
CreditOutsideSleep = true
OutsideSleepMinHours = 2
OutsideSleepMaxHours = 14
OutsideSleepQuality = 1.0


[Map]
; Markers for the food shops.
ShowShopBlips = true

; WHETHER A VENDING MACHINE OR A FRUIT STALL YOU HAVE BEEN NEAR STAYS ON THE MAP.
;
; Those two have no line in vendors.json -- they are found by MODEL, which is why
; every one of them in the world works -- so their markers used to be keyed on the
; prop's handle and died when the prop streamed out. Drive away and the marker
; goes; drive back and the same machine returns under a new number. So the map
; only ever showed what was already loaded around you, which is the one place you
; do not need a map to find a drink.
;
; On, they are remembered by POSITION instead, which is the thing about a vending
; machine that is actually true: it does not move. Written to machines.json beside
; the needs, so a map filled in over one session is still filled in the next.
;
; They are short-range markers, so this puts them on the PAUSE map always and on
; the minimap only when you are near one -- several hundred of them do not end up
; on the minimap at once. Delete machines.json, or press Forget on the F11 map
; page, to start the map over.
RememberMachines = true

; The most that will ever be remembered. There are several hundred in the world;
; this is not a limit anybody meets by playing, it is there so the file cannot
; grow forever. It is written to the log when it is reached rather than quietly
; enforced.
RememberMachinesMax = 900

; HOW FAST THE MAP SURVEY FLIES, in metres per second. The survey is the row
; "Survey the map for machines" on the F11 page: it takes you off the ground and
; flies the whole map on a zig-zag grid, and every machine and stall it passes is
; found by the ordinary scan and kept.
;
; THIS IS THE ONE NUMBER THAT DECIDES WHETHER IT WORKS. Map props do not exist
; until the game has streamed them, so a survey that outruns the streamer will
; finish, report success, and have found a third of what is out there -- which is
; the worst kind of failure, because it looks exactly like the good one. 45 m/s
; is about 160 km/h and is well inside what the engine keeps up with at rooftop
; height. Raising it is the obvious economy and the obvious mistake.
;
; THE WHOLE MAP IS ABOUT TWO HOURS at this speed and the default scan radius --
; 26 lanes and 300 km. That is the honest figure. The F11 row shows the percentage
; and the minutes left while it runs, and stopping it keeps everything found so
; far; there is nothing to lose by starting it and changing your mind.
SurveySpeed = 45

; THE RECTANGLE IT FLIES, in world coordinates.
;
; The default is the whole playable map, ocean included. The ocean holds nothing
; and is flown anyway, because carving it out means the mod knowing the coastline
; and a wrong guess there is a stretch of Chumash that never gets surveyed and no
; way to tell.
;
; NEARLY EVERY MACHINE IN THE GAME IS IN LOS SANTOS PROPER, and that rectangle is
; 11 lanes, 51 km and about twenty minutes. Paste these four to survey only it:
;
;     SurveyWest = -2200
;     SurveyEast = 1300
;     SurveySouth = -3400
;     SurveyNorth = 1200
;
; The city and the Blaine County roads, which picks up the desert servos and the
; Paleto stalls, is about an hour: -3000, 2600, -3500, 7000.
SurveyWest = -3900
SurveyEast = 4400
SurveySouth = -3800
SurveyNorth = 7800

; How close before a shop's marker EXISTS, in metres. 0 shows them all, always.
; Created and destroyed by distance rather than merely hidden: twenty-five
; permanent blips compete with the ones the game already puts there, and the
; useful message is "there is food near you", not a directory of every taco.
ShopBlipRange = 220

; Whether they also show on the PAUSE map. On -- the blips are GROUPED, so the
; legend collects them under one name and steps through them with left and
; right, which makes the big map a directory you can page rather than a rash of
; pins. Turn it off if you would rather the pause map stayed clean.
ShopBlipsOnMainMap = true

; Whether every shop marker carries the SAME name, so the pause map's legend
; lists them once instead of once each.
;
; THE LEGEND GROUPS BY NAME -- that is the whole mechanism. It is built from the
; distinct names of the blips on the map, which is why six Bean Machines have
; always been one row and not six. Everything else has a name of its own, so a
; hundred shops is a hundred rows and the list runs past a hundred and forty
; with the game's own markers in among them.
;
; A shared name collapses them, and the legend's left and right keys step through
; the blips INSIDE the selected row -- so one row is one place to stand and slide
; through every shop of that kind in the city.
;
; BY KIND, NOT ALL AS ONE. It used to be a single name for every shop, which was
; one row and no use for finding a liquor store. The name is the group's now --
; Liquor, Bars, Fast Food, Restaurants, Cafes, Street Food, Shops, Smoke Shops,
; Convenience Store, Pharmacy -- so the legend is a short list of kinds, each paging through
; its own. The groups and what is in them live in vendors.json; anything with no
; group falls back to ShopBlipGroupName below.
;
; It costs the shop's name when you highlight a marker: it will say the kind
; instead. The shop still names itself when you walk up to its door.
GroupShopBlips = true

; What that row is called, and what a highlighted marker says.
ShopBlipGroupName = Food

; Whether hovering a shop's marker on the PAUSE map puts up a card with the
; shop's name and hours. The legend still groups them under the name above;
; the card is how you find out WHICH one the cursor is on. It uses the hook the
; game gives Online's job blips, the one popup the pause map allows a script.
; Also in the F11 menu.
ShopBlipHoverCard = true


[Money]

; Buying puts it in your pocket to eat later rather than eating it on the spot.
; Off restores the old behaviour: one item per visit, eaten where you stand.
BuyToPantry = true

; How many items fit in a pocket, ALL KINDS COUNTED TOGETHER -- twenty tacos and
; one of everything are the same twenty.
PantrySlots = 5
; Scales every price at once, if you find them wrong for your game.
PriceMultiplier = 1.0


[Fridge]

; The fridges in the safehouse kitchens. Walk up to one on foot and press the
; interact key: what is on you is on the left, what is in the fridge is on the
; right, LEFT and RIGHT cross between them, SPACE moves one across and ENTER
; eats it where it stands.
;
; FOUND BY MODEL, NOT BY COORDINATE, so every kitchen the base game put a fridge
; in works -- Franklin's aunt's, Michael's, Trevor's trailer. Shop chillers are
; deliberately left out: they sit inside the 24/7s and the liquor stores, where
; the till already offers you a shelf on the same key.
;
; It is ONE store per character, reachable from any of that character's fridges.
; Per-fridge storage would mean remembering which kitchen you left the chicken in.
Enabled = true

; How much it holds, all kinds counted together. Deliberately far more than the
; three a pocket holds: somewhere with room is the whole reason to have one.
Slots = 40

; How close you have to stand, in metres.
Reach = 1.8

; Extra fridge models to look for, comma-separated, on top of the built-in list.
;
; A fridge is found by MODEL NAME, so a kitchen this build has not heard of -- a
; house from an interior mod, a room added to the game after this was written --
; has a fridge that does not answer. Put its model here and it will.
;
; The log line beginning "Fridges:" says how many names resolved and names any
; that did not, so a typo tells you it is a typo. A name that does not exist in
; your game costs one line in the log and nothing else.
;
;   ExtraModels = prop_fridge_04, v_res_myhouse_fridge
ExtraModels =


[Eating]

; How food is turned in his hand, in degrees about the prop's own X, Y and Z.
;
; The food models were not built to sit in a hand, so with no turn the hot dog
; lies ACROSS the mouth like corn on the cob. A quarter turn about Z points it
; into the mouth, and that is the default. Drinks and cigarettes are not turned.
; Read at load; there is no menu row for these any more.
FoodSpinX = 0
FoodSpinY = 0
FoodSpinZ = 90


[HUD]
Show = true

; WHICH SIDE OF THE MINIMAP THE BARS STAND ON. Left, Right, or Manual to use the
; X below instead.
;
; IT MOVES THE FUEL GAUGE TOO. Running on Fumes draws its gauge on whichever side
; this one is not: this mod publishes where the far side of the map is and that
; one stands there, because only this mod is in a position to know -- where the
; map sits depends on your safe-zone slider. So the two can never end up on the
; same side and there is no second setting to keep in step. Flip this and both
; move.
;
; Left by default, which is a swap: the bars were on the right and the gauge on
; the left because that is the order the two mods were built in, not because
; anybody chose it.
;
; This is the HORIZONTAL. AutoPosition below is the VERTICAL, and they used to be
; one switch -- which is why that switch is off here: turning it on to move the
; row sideways would have thrown away a hand-tuned foot as well.
Side = Left

; WHETHER THE ROW IS EXACTLY AS TALL AS THE MINIMAP FRAME. On, the bars start on
; the top of the frame's band and end on the top of its plate, so the two line up
; at both ends whatever the screen.
;
; Asked of the frame rather than typed to match it: both of those lines move --
; the band is as tall as the greater of BandHeight and however far a clamped blip
; can climb above the map, and the plate's top is the map's own bottom edge, which
; depends on your safe-zone slider. A BarLength set to match today stops matching
; the next time anything about the frame changes.
;
; IT OWNS THE HEIGHT AND THE FOOT TOGETHER, because fixing the top and the bottom
; of a bar leaves nothing for a length to say: BarLength below is unused while
; this is on, and so are Y and AutoPosition. Turn it off to place the row by hand.
MatchFrame = true


; Whether the FOOT of the row is worked out from the minimap rather than taken
; from Y below.
;
; OFF, because it asks the GAME where the minimap ends and the game answers for a
; VANILLA radar. Run anything that has resized the map and the row lands on top
; of it. Turn it on if your radar is stock and you want it tucked in tight -- it
; is the first row of the F11 placement page and moves it as you press it.
AutoPosition = false

; X is used only when Side = Manual; Y only when AutoPosition is false. Fractions
; of the screen, 0 to 1, and the TOP LEFT of the pair.
;
; ONE THING TO KNOW ABOUT A FIXED X: GTA anchors the minimap to screen HEIGHT, so
; the map is the same width in PIXELS on any monitor of the same height and a
; smaller FRACTION of the width the wider your screen is -- its right edge is at
; 0.157 of the width on 16:9 and about 0.117 on a 21:9. 0.252 is clear of it on
; either, but only on a wide screen is it clear by a little rather than a lot.
X = 0.252
Y = 0.996
; Icon height as a fraction of screen height. 0.032 is about 46 px at 1440p.
;
; It also sets the FOOT the pair stands on -- that is Y + Size * 2 + the gap --
; so on the BAR style, where nothing else uses it, Size is a position control.
; Do not wind it down to move the bars lower. Move Y.
Size = 0.032
; Clear air between the two icons, as a fraction of an icon's own height.
Gap = 0.22
Opacity = 0.72

; Whether the two icons move. A faint shimmer runs the whole time -- a few per
; cent of brightness, four seconds a cycle -- so they look lit rather than
; printed. On the LAST stage of either meter they also sway, slowly, and that
; one is meant to be caught out of the corner of your eye: by then the picture
; has run out of room to get any worse, so movement is all that is left.
; Which HUD is on screen: Bars or Icons.
;
; Not a replacement, a choice. The bars tell you the number and say nothing else;
; the icons -- an apple eaten down to a core, an eye closing -- say "you are
; getting hungry" at a glance and deliberately will NOT tell you a number.
;
; Bars ship because that is what people expect from a hunger mod. Set Icons here,
; or press right on HUD style in the F11 menu, and you have the other one.
;
; The bars are animated, and the two are animated DIFFERENTLY on purpose. Hunger
; churns -- an unsettled surface with the contents turning over underneath, and
; it gets more agitated the emptier it is, which is the opposite of a fuel
; gauge. Sleep breathes as a whole, and the breath slows and deepens as you
; tire. Sleep also has its own colours: blue awake, dark purple exhausted.
Style = Bars

; The bars' size. BarLength is the WHOLE gauge, plate included, so it means
; the same thing as Height does in Fumes. THE DEFAULTS ARE THE FUEL GAUGE'S OWN NUMBERS, straight out of
; Fumes -- two mods by the same hand putting instruments on the same screen should
; agree about how big an instrument is.
;
; Length is TALL, as a fraction of screen height; Width is across, as a fraction of
; screen width. Named Length rather than Height because the number is the run of
; the fill, and the bars stand up.
BarLength = 0.2213
; THE MOST THIS HUD WILL DRAW IN ONE FRAME, in rectangles.
;
; There is no such thing as a private budget. Rectangles come out of ONE list the
; whole machine shares -- every script and the game's own HUD together -- and past
; about 350 on a typical install the game silently drops the rest of the frame's.
; That is why another mod's panel can come up with no background while this HUD is
; on screen: it asked after the list was empty. Nothing a script can call divides
; that list up, so this mod cannot have its own; it can only be held to a share of
; the one there is, and this is that share.
;
; THE TRIMMING GIVES WAY, NEVER THE INSTRUMENT. Past this number the specks, the
; sheen and the crumbs stop and the bars, their frames and their levels carry on.
; Lower it if something else on your screen flickers; the cost is sparkle, and only
; while the frame is busy. The log says the peak each time it gets worse.
;
; RAISED FROM 200 WHEN THE ROW GREW A SIXTH BAR. The log said 224 in a frame
; against an allowance of 200, which meant the sparkle was being trimmed
; permanently and, worse, unevenly -- so it flickered. The bands each bar draws
; its gradient in were more than halved in the same change, which took far more
; off the count than this put back on.
DrawBudget = 260
; HOW FAR THE GAME'S OWN NOTIFICATIONS ARE LIFTED, in fractions of the screen.
;
; They sit just above the radar and stack upward, which was clear of everything
; until this mod put a band above the map with the street name in it -- and now a
; notification lands across the top of the frame. The map cannot be moved and the
; band is where the writing lives, so the notifications are what gives way.
;
; THEFEED_SET_SCRIPTED_MENU_HEIGHT is the game's own way of doing it: the height a
; script says it is occupying, which the feed keeps clear of. IF THEY GO THE WRONG
; WAY, NEGATE THIS -- the native takes a height and which way it moves the feed is
; the game's business, not something a script can read back. 0 turns it off and
; hands the notifications back to the game exactly as they were.
NotifyLift = 0.045
BarWidth = 0.0048

; The apple and the moon UNDER each bar, as a share of the bar's width. They used to
; stand in the foot of the channel where they could never be wider than the bar --
; nine pixels on a 1080p screen, which five apples cannot be told apart at. Out from
; under it nothing bounds them but taste.
BarIconScale = 0.85

; How far EITHER bar's surface moves, 0 to 1. Hunger bows; sleep takes a drop and
; settles. Pure feel, so it is a dial -- it has been wrong in both directions on
; both bars: hunger once as a wave rolling across fifteen pixels (jittery) and once
; at under two pixels of travel (invisible), sleep at three pixels (nobody could
; see it) and at seven (it pulled the eye).
BarWave = 1

; How fast EVERYTHING in both bars moves -- surface, the drift inside the fill,
; sediment and stars all read one clock, so this is the only "faster" that does
; not also change the shape of the animation. 42 is normal; 0.15 to 120 allowed.
BarPace = 42

; How much faster the whole gauge runs while he is RUNNING. A multiplier on top
; of BarPace, so the waterline, the contents and the stars keep their ratios and
; the whole instrument simply winds up -- and it winds up for exactly the reason
; the bars are emptying quicker, which is the point of having it. A jog is 0.45
; of the way there; a sprint is all of it. 1 turns it off entirely.
BarEffort = 2.0

; How fast the specks inside the bars drift, 0 to 1. 0 stops them dead.
; They are meant to be something you notice on the second look, not traffic --
; at 0.35 a crumb takes most of a minute to sink the length of the bar.
BarDrift = 1

; How hard a bar JOLTS when its level changes in a step, 0 to 1. A meal, a pill
; or a night's sleep throws the level and lets it ring down like liquid; the slow
; drain moves too little a frame to register. 0 is never. (Vitals' slosh.)
BarSlosh = 1

; How much the liquid moves with YOU, 0 to 1. Brake hard and the levels lift and
; lean, then settle; land from a height and they drop. 0 turns it off.
BarLean = 1

; THE BARS, LEFT TO RIGHT, BY NAME. Any order. Anything left out stands at the end
; in the default order; a name that is not one of them is ignored, so an old ini
; that still lists "armour" changes nothing. The vitals' bars only stand here on
; the Upright style; on Strip they lie under the minimap and the row closes up to
; the needs. "water" and "drink" are both accepted for thirst.
RowOrder = armour, health, sleep, food, thirst, energy

; THE WHOLE LOT AS ONE. An offset, in fractions of the screen, added to the row of
; bars AND to the cash readout, so the two move together; each keeps its own
; position under it (X and Y above, CashX and CashY below). The minimap and its
; frame stay where the game's safe-zone slider puts them -- no native the game
; gives a script moves the minimap. Positive Y is down. Also in the F11 menu.
GroupX = 0
GroupY = 0

; The cash readout, brought down beside the bars. The game's own cannot be moved
; there -- its Y is fixed by the stack it sits in at the top right -- so it is
; hidden and the same thing drawn off the end of the row: the total in the game's
; money face, the change under it, counting up, holding, fading. CashX and CashY
; nudge it from its place beside the last bar, in fractions of the screen;
; CashScale is the size of the text (0.55 is about the game's own); CashSeconds
; how long it stays up after the money moves. Off (the default) leaves the game's
; readout at the top right alone.
MoveCash = false
CashX = 0
CashY = 0
CashScale = 0.55
CashSeconds = 4



Animate = true

; How strong the constant breath is, 0 to 1. 0 switches it off. Raise it if you
; cannot see the icons moving at all; drop it if they will not sit still.
Shimmer = 0.55

; How strong the low-meter sway is, 0 to 1. It runs at half strength on the
; second-to-last stage of a meter and full on the last one.
Sway = 0.6

; Hide an icon while that need is comfortable. Off by default: a gauge that
; only appears once there is a problem cannot be learnt, because the first time
; you see it is the worst possible moment to work out what it means.
HideWhenFine = false
FineAbove = 0.60

; Pulse an icon once its need is critical.
FlashWhenCritical = true


[Keys]
; The one key this mod uses -- the counter, the bed and the car alike.
;
; It is proximity-gated, so it only does anything within reach of one of those.
; That is why sharing E with other mods' interact keys is safe: each only fires
; at its own thing. Any System.Windows.Forms key name works, e.g. E, F, Y, NumPad0.
Interact = E

; Opens the settings menu, where everything above can be changed in game and
; watched as it changes. Any System.Windows.Forms key name works.
Menu = F11

; Opens the pocket: what you have bought and not eaten yet.
Bag = F12

; Runs the map survey -- the same thing as the row on the menu page, on a key,
; because it is a tool you use once and then never again.
;
; SCROLL LOCK, deliberately. This wants a key nothing sane has bound rather than
; a place on a function row where all twelve are already taken: it does nothing
; in GTA, nothing in Windows, and is nowhere near anything you might lean on.
Survey = Scroll

; The menu and the pocket on a CONTROLLER, as a chord rather than a button --
; there is no spare button on a pad, every one is spoken for on foot, so a
; single press is always one press away from something the game already does.
;
;   LB + D-pad UP     the settings menu
;   RB + A            your pocket
;
; Fumes already uses LB + D-pad DOWN for its own menu, so these avoid it.
;
; The interact needs no setting: everything that reads E already reads the pad's
; context button beside it, which is the one the on-screen prompt shows you.
MenuPad = true
BagPad = true

; What the prompt's key cap SAYS when you are on a controller. Any text. The
; button itself is the game's own context button (D-pad right on a stock Xbox
; layout, which is the default here); this only changes the word on the cap, so
; a PlayStation pad can say RIGHT or whatever you like. Also in the F11 menu.
PadInteractLabel = D-PAD RIGHT


[Counters]
; Game scripts to shut down while you are stood at one of our counters, comma
; separated.
;
; ob_cashregister is the vanilla store menu -- the "P's & Q's $1 / EgoChaser $2"
; list with Shoplift and Select on it. Confirmed by name off a live counter, not
; guessed: the log at that counter also had shop_controller and ShopRobberies
; running, and shop_controller is the obvious suspect but ALSO runs Ammu-Nation,
; the clothing shops and the barbers. ob_ means a script attached to one object,
; so this ends the register's own menu and nothing else. Robbing stores still
; works.
;
; Bare Minimum logs every running script the first time you use a counter, so
; anything else that needs shutting up can be added here without a rebuild.
; Leaving this blank means suppress nothing.
SuppressScripts = ob_cashregister

; How far from a till the above is done, in metres. WIDER THAN OUR OWN PROMPT ON
; PURPOSE: our counter offers itself at 1.9m, close enough to be leaning on it,
; and the game's own shop trigger is bigger than that -- so a sweep tied to our
; reach arrived after the vanilla list had already been offered and taken.
HushReach = 5.0

; Also hold the context button down inside that radius, so the game's menu cannot
; hear the press even in the moment after it restarts its own script. Our key and
; a pad both still reach us: we read the disabled state, not the live one.
;
; Turn this off if something else you use needs E next to a shop counter.
BlockVanillaMenu = true

; ---- vending machines and roadside stalls -----------------------------------
;
; Both are found by MODEL rather than listed by coordinate, the same way the
; fridges and the tills are, so every one of them in the world works and a map
; mod's machines work too.

; The SNACK machines -- the candy box, not the soda machine.
;
; The soda machines are deliberately NOT sold from: the game already sells a
; drink out of one, plays its own animation and gives you a little health for
; it, and a second purchase on top would be two mods fighting over one prop.
; The candy machine sells nothing in the vanilla game -- it is scenery -- so
; there is nothing there to fight with. It stocks snacks and drinks, never hot
; food, and plays the game's own vending animation when it sells.
VendingMachines = true

; The roadside fruit and veg stalls. The game repeats the same canopy from the
; Chumash coast to Chiliad, so one model finds all of them.
FruitStalls = true

; What is on the trestle, as ids out of foods.json, comma separated.
;
; A LIST RATHER THAN A CATEGORY, because "fruit" is not a category: an apple is
; a Snack and a fresh fruit is Food, so a category filter would either miss half
; the crate or sell beef jerky off it.
StallItems = fruit,apple,got_box

; How much hunger a drink from a VANILLA soda machine gives back, 0 to 0.5.
; 0 turns it off.
;
; Small on purpose. This does not sell you anything -- it notices that the game
; did, by watching for the drinking animation, and lets the meter know you
; drank something. That is all it does.
VendingSipHunger = 0.05

; And how much THIRST, 0 to 1. Ten times the hunger figure, because that is what
; a can of soft drink is: barely a meal and very much a drink. 0 turns it off,
; and with both at 0 the machines are not watched at all.
VendingSipThirst = 0.5

; Whether the machines and the stalls get map markers of their own. They obey
; ShowShopBlips as well, and they share the shops' group name so they collapse
; into one row on the pause map's legend rather than thirty.
MachineBlips = true

; Whether the carts the GAME placed get a man behind them and start selling.
;
; The hot dog and burger carts listed in vendors.json are built by this mod at a
; coordinate. The game places carts of its own that nobody could buy from, and
; this staffs those -- found by model, so every one in the world works.
;
; A discovered cart is never deleted. It was there before the mod loaded.
DiscoverCarts = true

; Whether a shop with a room listed in vendors.json can be walked into. PRESS
; the key at its door for the shelf on the pavement, as ever; HOLD it to go in.
; The room is one of the game's own interiors -- a real 24/7, a real Rob's
; Liquor, a real LTD, Tequi-la-la, Bahama Mamas -- and the door warps you there
; and back. Hold the key on the ring inside to come out. Off makes every door a
; shelf only.
WalkIns = true


[Social]
; The shops and stalls posting on Hoodrich's social feed.
;
; DOES NOTHING WITHOUT HOODRICH. Bare Minimum has no feed of its own; it hands a
; finished post to Hoodrich's and stays out of the way. With Hoodrich absent
; nothing here is read and one line in the log says so.
Enabled = true

; Percent chance that an occasion worth posting about actually produces a post.
ChancePercent = 22

; Shortest gap between two posts from this mod, in real seconds. Long on
; purpose: Hoodrich's feed is somebody else's system and it is already busy.
GapSeconds = 240


[Speech]
; Whether the player says anything when he buys something -- a "thanks" over the
; counter before the food comes out.
;
; THE GAME'S OWN LINES, from the ambient speech bank, so it is a Franklin line for
; Franklin and a Trevor line for Trevor. Nothing is shipped by this mod. The names
; themselves live in foods.json under "speech".
Enabled = true

; Percent chance a purchase actually gets a line out of him.
ChancePercent = 45

; Shortest gap between two lines, in real seconds. A man who thanks the cashier
; every single time has a tic; the gap is what keeps it feeling like a person.
GapSeconds = 45

; HE SAYS WHERE HE IS when he crosses into a new suburb. The game has a line for a
; hundred and one places in each protagonist's own voice -- Chamberlain Hills,
; Sandy Shores, Vespucci Beach and the rest -- recorded for the friend chatter and
; otherwise never heard in single player. No audio is shipped for this.
;
; On the CROSSING rather than on a timer, and only sometimes: a man who announces
; every suburb he drives through is a satnav. LocationChance is the percent of new
; suburbs that get named, and GapSeconds above applies on top, so crossing four in
; a minute cannot get four lines out of him. He also has to still be in the new
; suburb a few seconds later, or a road that runs a border is a man naming two
; suburbs at each other. Anywhere the game has no line for passes in silence.
Locations = true
LocationChance = 25


[Vitals]
; HEALTH, ARMOUR AND ENERGY, drawn as bars of ours. This was a mod of its own,
; Vitals, and lives here now. The game's own health and armour strip under the
; minimap goes -- the minimap is asked for the layout it uses on the golf course,
; which has no bars in it, the same trick FiveM servers have used for years -- and
; so does its special ability bar. Nothing on disk is touched and both come back
; the moment the script unloads, or when this is turned off.
Enabled = true

; Upright: three columns at the LEFT of the row, framed exactly as the sleep and
; food bars are, with a heart, a shield and a bolt on the plates under them. The
; row reads health, armour, energy, sleep, food. Strip: three bars lying where the
; game's own strip was, under the minimap. Upright needs the HUD on its Bars style;
; on Icons the three lie down.
Style = Upright

; THE THIRD BAR IS ENERGY. It drains while you sprint and, empty, caps you at a
; jog -- tired, the way the game's own stamina does -- until it has come back to
; EnergySprintAgainAt.
; It refills on its own, faster stood still or in a car than at a jog. The bar is
; also the SPECIAL ABILITY'S TANK (see EnergyPowersSpecial): it lights and beats
; while the ability runs, and the ability is drinking from it. Off, the third bar
; is the special ability's charge instead (see Special and the Special* rates below).
Energy = true

; Seconds of flat-out sprinting from full to empty; seconds from empty back to full;
; how far back up (0 to 1) it has to be before you can sprint again.
EnergySprintSeconds = 39
EnergyRebuildSeconds = 10
EnergySprintAgainAt = 0.35

; THE SPECIAL ABILITY RUNS ON THIS BAR. Rage, focus, the slow motion: while it is on
; it drains the energy bar, and when the bar is out the ability stops with it and you
; are winded. The game's own meter is kept topped up rather than read, so this bar is
; the only limit -- which also means the ability can always be started while there is
; something in it. Off hands the ability back to the game untouched. The second number
; is how many seconds of ability a full bar is worth; sprinting through one costs both.
EnergyPowersSpecial = true
EnergySpecialSeconds = 30
; How long a drink holds the energy bar full, in REAL minutes. 0 turns it off.
;
; Anything he drinks that is not alcohol - a soft drink, a coffee, a water, a
; juice. Sprinting does not run the bar down while this holds, and being winded is
; lifted the moment it starts. Real minutes rather than game hours, because the
; energy bar is a real-time meter: it drains in the seconds you hold sprint.
EnergyDrinkHoldMinutes = 15

; Shows the game's own bars again, with ours at half strength over them, so the two
; can be checked against each other. Also in the F11 menu.
Compare = false

; Which of the game's own bars go. You should not need these.
HideHealthArmour = true
HideSpecial = true

; The minimap layouts asked for: HideType while hiding, ShowType to bring the bars
; back. 3 is the golf course; 0 is what single player normally runs.
HideType = 3
ShowType = 0

; HOW OFTEN THE LAYOUT IS ASKED FOR AGAIN, in milliseconds. 0 is "only when
; something has happened that could have undone it", and that is what you want.
;
; IT USED TO BE EVERY FRAME, AND THAT IS WHAT MADE THE GPS FLICKER. The layout call
; is not a switch being flipped; it is a RE-LAYOUT of the minimap, which is why the
; map comes back blank after the first one -- see MapFlick above. The map's own
; picture survives that. The GPS does not: the route line and the turn arrow are
; built by the minimap only while a route is set, so asking sixty times a second
; tore them down and rebuilt them sixty times a second, and they strobed. Nothing
; else on the map moved, so it looked like a fault in the GPS.
;
; It is asked once now, and again when the pause menu closes, a fade ends, a
; character switch finishes, a cutscene ends, or Franklin comes back in a new body
; -- the moments the game rebuilds its HUD and could have put its own strip back.
;
; SET THIS TO 1 IF THE GAME'S HEALTH STRIP EVER COMES BACK AND STAYS. That is the
; old every-frame behaviour, and it means there is a sixth moment missing from that
; list. Anything in between is a heartbeat, and a heartbeat flickers the GPS at its
; own rate instead of at sixty a second, which is worse than either end.
HideRepeatMs = 0

; THE MINIMAP GOES BLANK once it has been told to use the golf layout, and stays
; blank until the game rebuilds it -- which opening the pause menu once does. So
; the big map is flicked open and shut right after the first layout call, which
; makes the game rebuild the minimap; the shut is held back and repeated so it is
; not ignored the way a one-frame shut was. Expect the big map for a fraction of a
; second when the script loads.
MapFlick = true

; The alternative, only used with MapFlick off: the radar switched off and on for
; one frame. Tried first; it did NOT bring the minimap back here.
RefreshRadar = false

; Collapse the big map once when the mod starts. Off: this mod never opens it
; except for the flick, which shuts it itself.
ShrinkMapOnStart = false

; With Energy off: whether a special ability bar is drawn -- Auto (only for
; Michael, Franklin and Trevor, which is when the game draws its own), Always, Never.
Special = Auto

; r,g,b or r,g,b,a. Health is RED the whole way -- vivid at full, dark red at
; nothing -- and this is only the TOP of that ramp; the two darker stops under it
; are not settings. It went red because every other bar in the row is one colour
; family that darkens as it empties, and health changing HUE with its level was
; the only exception: halfway down it was an amber belonging to no meter at all.
; What the old green-to-red said is said better by the low-health beat below.
; Armour is the game's blue; energy
; is a fluorescent green-yellow, and the special ability, when shown instead, is
; gold. Energy has moved twice: yellow is the fuel gauge's, and teal turned out to
; be thirst's. Pink, 230,80,210, is the other colour nothing else here uses.
HealthColour = 236,40,44
ArmourColour = 93,182,229
EnergyColour = 196,246,40
SpecialColour = 240,200,80

; One clock for everything periodic in the three. 1 is normal; 0.5 is half speed.
; The jolt when a bar is hit and the lean under braking are the HUD's own dials,
; BarSlosh and BarLean, shared with the sleep and food bars.
Pace = 1.0

; How many specks live inside the three, 0 to 1. A pulse climbs the health bar at
; the heart's own rate, glints climb the armour, and charge streaks run up the
; energy while it rebuilds and down while you spend it. 0 is none.
Particles = 1.0

; A lighter band along one side of the fill, 0 to 1. 0 is flat.
Gloss = 0.18
; The bevel and the sweeping highlight on the fill, 0 to 1. 0 is flat.
;
; A lit edge down the left of the fill and a shadowed one down the right, so it
; stands off the channel instead of lying flat in it, with a soft slanted band
; crossing every six seconds or so. It was the armour bar's alone; every bar in
; the row wears it now, and the fuel gauge wears the same one at the same numbers.
Relief = 1

; Beat the health bar toward red once there is less than LowHealthAt left.
LowHealthPulse = true
LowHealthAt = 0.25

; The third bar brightens and beats while the special ability is running.
ActivePulse = true

; THE SPECIAL METER'S RATES, for when Energy is off. The game does not say how full
; the meter is -- only whether it is full and whether the ability is running -- so
; the level is worked out: run down while the ability is on, refilled while it is
; off, snapped to full and to empty whenever the game says so.
SpecialDurationSeconds = 30
SpecialMinDurationFraction = 0.30
SpecialRechargeSeconds = 150
SpecialMinimumCharge = 0.10


[VitalsStrip]
; THE STRIP STYLE ONLY. Auto asks the game where its minimap is and puts the strip
; over the game's own. It is wrong if something else has resized your radar; then
; turn Auto off and put the numbers in yourself, with Compare to check against.
Auto = true

; Used only when Auto is off. Fractions of the screen: X is the strip's LEFT edge,
; Y is the BOTTOM of the game's own strip, Width is the minimap's width as a
; fraction of screen HEIGHT.
X = 0.0150
Y = 0.9860
Width = 0.25

; A multiplier on the width. On a 21:9 screen the game's answer came out about a
; quarter too wide; 0.8 is about right there.
WidthScale = 1.0

; How thick the strip's bars are, as a fraction of screen WIDTH -- the same unit as
; the HUD's BarWidth, so the two match in pixels.
Thickness = 0.0048

; Nudges on top of wherever the strip landed. Positive X is right; positive Y is DOWN.
OffsetX = 0
OffsetY = 0

; How the strip is shared out. The game gives health half and splits the rest.
HealthShare = 0.50
ThirdShare = 0.25

; Daylight between two bars, as a fraction of the strip's width.
Gap = 0.008

; The empty part of a bar, r,g,b,a; and how solid the strip is, 0 to 1. The upright
; columns take the HUD's own channel and opacity instead.
Channel = 0,0,0,110
Opacity = 0.85


[Minimap]
; HOW SOLID THE FRAME'S BLACK IS, 0 to 1. The frame round the minimap only -- the
; BARS keep [HUD] Opacity and are unaffected by this.
;
; The frame used to read that number too, and it is 0.72 here: a frame based on
; 228 reached the screen at 164 of 255 and you could read the pavement through it.
; [HUD] Opacity is for the coloured LEVELS, which you deliberately see through;
; this is a panel with writing on it whose job is to be a hard edge.
;
; The bars' own outlines were raised with it for one build and put back. A hairline
; round a nine-pixel column and a big flat panel want opposite things.
;
; NOT 1, on purpose. A completely opaque box round the minimap stops looking like
; part of the game's HUD and starts looking pasted over it.
Opacity = 0.92

; A frame round the minimap in the bars' own black -- the same edge, at the same
; opacity, as the surround on every bar -- so the map and the row of five read as
; one instrument. Where the game's health strip used to sit under the map there is
; a plate, the bars' plate.
Frame = true

; The street and the suburb you are in, always, written into the frame's top band:
; street at the left, suburb at the right, either side of the compass, each cut to
; the room it has. The game's own area and street names, which show for a moment
; when you get into a car, are hidden while this is on.
Label = true

; How far outside the map the frame sits, as a fraction of screen height, with a
; translucent mat filling the gap. The game clamps far-off blips to the edge of
; the map and half of each pokes over it; flush (0) puts that half under the frame
; line, a gap leaves them clear and dims them through the mat. 0.006 is about
; half a blip.
FrameGap = 0.006

; How far DOWN INTO the map the frame's top band reaches, as a fraction of the map's
; height. The radar fades out at the top and lets the world through and the band
; comes down over that so the map ends hard -- but every bit past the fade is map
; you have paid for and cannot see, so this is the smallest number that still
; buries it. 0 is a plain line. The room the writing needs is BandHeight, above
; the map, and has nothing to do with this.
TopCover = 0.05
; How tall the band ABOVE the map is, as a fraction of screen height: the room the
; street, the suburb and the compass are written in. THE GAME DRAWS ITS BLIPS OVER
; ANYTHING A SCRIPT DRAWS, and a far-off blip is clamped to the map's edge with half
; of it hanging over the top -- a thin band put the writing right under that row of
; blips and neither could be read. Nothing here can hide them, so the band rises
; clear of them instead. Grow [HUD] BarLength by the same amount or the bars and the
; frame stop ending on the same line.
BandHeight = 0.034
; Pushes the plate under the map further down, clear of the blips that hang below the
; map's edge. The plate already starts at the map's bottom edge and the frame's foot
; drops far enough to keep a line of text under it, which reaches within a few pixels
; of the bottom of the screen -- so there is no room left to clear those blips as
; well. Whatever this buys comes out of the plate's own height, and the writing in it
; shrinks to fit what is left.
PlateDrop = 0

; A compass tape in the middle of the frame's top band -- ticks every fifteen
; degrees and N, E, S, W scrolling under a pointer as you turn -- and, in a
; vehicle, your speed at the right of the plate under the map, the unit stood on
; end beside it, the gear in the corner and a small rev bar that lights with the
; engine, green to red. The compass needs a band tall enough to write in; TopCover
; at 0 is a plain line.
Compass = true
Speedo = true

; The dashboard lights at the LEFT of the plate under the map, in a vehicle: an oil can that warms from
; grey through amber to red as the engine and the body take damage, and flashes once
; the engine smokes; a headlamp lit when the lights are on (blue-white on high beam);
; and the handbrake, red while it is pulled. Dim at rest rather than absent, the way
; a dash does it.
Dash = true

; THE AIR METER, across the plate under the map, only while you are under water.
;
; THE GAME'S OWN BREATH BAR IS GONE AND CANNOT BE BROUGHT BACK ON ITS OWN. It is
; drawn in the same part of the minimap as the health and armour bars, so the
; layout that hides those -- see [Vitals] HideHealthArmour -- hides it too, and
; there is one layout, not three. Letting it back means letting the health strip
; back with it, and the space it used has the plate in it now.
;
; So this is drawn instead, in the place the original had, and it takes the plate
; for as long as it is up. The plate's speed and dash lights both want a vehicle,
; so on a swim there is nothing there to displace.
;
; The full mark is measured rather than assumed: the highest reading of the dive is
; the full, so a diving ability or a rebreather is accounted for without being told
; about. It beats when it is nearly out, and faster the less is left.
Breath = true

; The air meter at a full chest, R,G,B. It runs down through a blue to a deep navy
; as the air goes -- hue says which meter, brightness says how bad, the same as
; every other bar here.
;
; Pale rather than the thirst bar's cyan on purpose. Two different facts about
; water in two different places, but a bar the colour of the thirst bar is a bar
; somebody reads as the thirst bar for a second, and a second is the whole unit
; this meter deals in.
BreathColour = 168,226,255

; KPH or MPH.
SpeedUnits = KPH
