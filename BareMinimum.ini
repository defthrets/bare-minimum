; ===========================================================================
;  Bare Minimum  -  hunger and sleep for GTA V
; ===========================================================================
;
;  This file is NEVER overwritten by an update. That is deliberate -- it is the
;  file you hand-edit. When a new version adds a setting, the deploy prints
;  which ones are missing and the defaults apply until you add them.
;
;  Every value here is the default. Deleting a line is the same as leaving it.
;
;  Times are in GAME hours, not real ones. At GTA's default rate a game hour is
;  about two real minutes, so a full game day is roughly 48 minutes of play.

[General]
Enabled = true
AnnounceOnLoad = true
; Error, Warn, Info or Debug. Debug is loud; it names every clipset request.
LogLevel = Info


[Hunger]
Enabled = true

; Game hours from a full stomach to an empty one, standing still.
; 28 is a bit over one game day -- around an hour of real play.
HoursToEmpty = 28

; How much faster you burn through it while sprinting, swimming or climbing.
; Running gets a bit under half of this. Driving counts as standing still.
ExertionMultiplier = 2.2

; How much you burn through while asleep. Low, but not nothing -- a night's
; sleep should cost you a meal.
SleepMultiplier = 0.45


[Sleep]
Enabled = true

; Game hours awake before the meter is empty. 44 is just under two game days,
; so the first slowdown lands around a day and a bit without sleep.
HoursToEmpty = 44


[Effects]
; --- hunger ---
; Below this you start to slow down.
HungerSlowAt = 0.34
; Below this you walk like your stomach hurts.
HungerHurtAt = 0.15
; The slowest hunger alone will make you walk, against normal speed.
HungerMinMoveRate = 0.72
; The game's own hunched, side-clutching limp. Any movement clipset name works;
; a name that does not exist is reported once in the log and then ignored.
HungerClipset = move_m@injured

; --- sleep ---
; Below this, missed sleep starts to show.
SleepTiredAt = 0.35
; Below this you are properly out of it: unsteady walk, swaying camera, blur.
SleepDrunkAt = 0.18
SleepMinMoveRate = 0.85
; MODERATE drunk, not verydrunk. verydrunk is a stagger that makes doorways
; impossible; this is loose and unsteady but still gets you where you are going.
SleepClipset = move_m@drunk@moderatedrunk
; How hard the camera sways when exhausted. 0 turns it off entirely.
SleepCameraShake = 0.14

; --- well fed and rested ---
; A small speed bonus on foot when BOTH needs are up. 1.0 turns it off.
;
; Keep it small. The move-rate override scales the ANIMATIONS as well as the
; speed, so a big number does not read as "well fed", it reads as the game
; running fast -- the legs cycle quicker than the ground moves.
;
; The WORSE of the two needs decides it, so eating well and never sleeping does
; not collect it. Ramps in from WellFedAbove to completely full.
WellFedBonus = 1.05
WellFedAbove = 0.85

; --- starving ---
; Whether an empty stomach slowly costs health. It will never kill you: the
; floor is a sixth of your maximum, and it stops there.
StarvingCostsHealth = true
StarvingHealthPerHour = 4


[Sleeping]
; Beds at the safehouses.
InBeds = true
; Dozing in a stopped car. Shorter, and worth less than a real bed.
InCars = true

BedHours = 8
CarHours = 4
; How much of a night a car is worth. A car is a WORSE sleep, not just a
; shorter one -- without this it would simply be a bed you carry around.
CarRestoreFraction = 0.55

; How close to a bed you have to stand before it offers, in metres.
BedReach = 1.6


[Money]
; Scales every price at once, if you find them wrong for your game.
PriceMultiplier = 1.0


[HUD]
Show = true

; Put the icons beside the minimap automatically, whatever shape your screen is.
;
; LEAVE THIS ON unless you want them somewhere else entirely. GTA anchors the
; minimap to screen HEIGHT, so it is the same width in pixels on any monitor of
; the same height -- and a smaller FRACTION of the width the wider your screen
; gets. Its right edge is at 0.157 of the width on 16:9 and about 0.117 on a
; 21:9 ultrawide, so a fixed X is only ever right for one shape of screen.
AutoPosition = true

; Used only when AutoPosition is false. Fractions of the screen, 0 to 1.
X = 0.163
Y = 0.836

; Icon height as a fraction of screen height. 0.032 is about 46 px at 1440p.
Size = 0.032
; Clear air between the two icons, as a fraction of an icon's own height.
Gap = 0.22
Opacity = 0.92

; Hide an icon while that need is comfortable. Off by default: a gauge that
; only appears once there is a problem cannot be learnt, because the first time
; you see it is the worst possible moment to work out what it means.
HideWhenFine = false
FineAbove = 0.60

; Pulse an icon once its need is critical.
FlashWhenCritical = true


[Keys]
; The one key this mod uses -- the counter, the bed and the car alike.
;
; It is proximity-gated, so it only does anything within reach of one of those.
; That is why sharing E with other mods' interact keys is safe: each only fires
; at its own thing. Any System.Windows.Forms key name works, e.g. E, F, Y, NumPad0.
Interact = E

; Opens the settings menu, where everything above can be changed in game and
; watched as it changes. Verified free on this install: the only "F7" under
; scripts\ was a key-code reference table in SafeCracker.ini, not a binding.
; Nearby: F2 Hoodrich, F3 Overspray, F8 Dealien Roleplay Menu, F10/F11 PullMeOver.
Menu = F7
